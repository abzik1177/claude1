backend:
  name: git-gateway
  branch: main

# Decap CMS orqali post qo'shilganda/o'zgartirilganda git repoga commit qilinadi,
# Netlify buni ko'rib avtomatik qayta build qiladi (statik sayt yangilanadi).
publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog maqolalari"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    summary: "{{title}} — {{pubDate}}"
    fields:
      - { label: "Sarlavha", name: "title", widget: "string" }
      - { label: "Qisqa tavsif (SEO uchun, 1-2 gap)", name: "description", widget: "text" }
      - { label: "Nashr sanasi", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Yangilangan sana", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - label: "Teglar"
        name: "tags"
        widget: "list"
        default: ["Maqola"]
      - { label: "Qoralama (saytda ko'rinmaydi)", name: "draft", widget: "boolean", default: false }
      - { label: "Maqola matni", name: "body", widget: "markdown" }
